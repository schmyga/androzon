<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Androzon Plugin</title>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            max-width: 200px;
        }
        .info {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="androzon.png" alt="Androzon">
    </div>
    
    <div class="info">
        <h2>Androzon Plugin</h2>
        <p>Универсальный плагин для поиска контента с поддержкой Android, Tizen и Web.</p>
    </div>
    
    <div class="info">
        <h3>Поддерживаемые балансеры:</h3>
        <ul>
            <li>Rezka</li>
            <li>Filmix</li>
        </ul>
    </div>
</body>
</html>
